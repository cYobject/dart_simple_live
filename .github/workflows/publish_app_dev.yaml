name: app-build-action-dev

on:
  workflow_dispatch:
  push:
    tags:
      - "dev_v*"

jobs:
  # 彻底删除之前的 build-mac-ios-android, build-linux, build-windows
  # 只保留这一个纯粹的 Android 打包任务
  build-android:
    # 核心修改：使用 ubuntu-latest，避开 macOS 下的 Git 路径和依赖报错
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # 1. 签出代码
      - uses: actions/checkout@v4
        with:
          ref: dev
          lfs: false # 禁用 LFS 增加稳定性

      # 2. APK 签名设置 (保持你原有的逻辑)
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # 3. 设置 JAVA 环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 4. 设置 Flutter 环境
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 5. 更新 Flutter 的 packages
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      # 6. 核心步骤：只打包 APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 7. 上传 Artifacts (方便在 Actions 页面直接下载)
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # 完成提示
      - run: echo "🍏 Android build job status is ${{ job.status }}."
